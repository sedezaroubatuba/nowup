services:
  - type: web
    name: nowup
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: NOWUP_DB
        value: /app/persist/nowup.db
      - key: NOWUP_UPLOAD_DIR
        value: /app/persist/uploads
      - key: NOWUP_HTTPS
        value: "1"
      - key: NOWUP_ADMIN_EMAIL
        sync: false
      - key: NOWUP_ADMIN_PASSWORD
        sync: false
      - key: NOWUP_ADMIN_SECRET
        generateValue: true
      - key: NOWUP_JWT_SECRET
        generateValue: true
      - key: NOWUP_KYC_DIR
        value: /app/persist/kyc-private
      - key: NOWUP_BILLING_WORKER
        value: "0"
      - key: ASAAS_API_BASE
        value: https://api-sandbox.asaas.com/v3
    disk:
      name: nowup-data
      mountPath: /app/persist
      sizeGB: 1
