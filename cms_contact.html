{% extends 'base.html' %}{% block title %}Contato | NowUp{% endblock %}{% block content %}<main class="container section"><div class="formCard"><h1>Fale com a NowUp</h1><p class="muted">Quer anunciar, tirar uma dúvida ou falar com o suporte? Envie sua mensagem.</p>{% if request.query_params.get('enviado') %}<div class="alert">Mensagem enviada com sucesso.</div>{% endif %}<form action="/contato" method="post"><div class="grid2"><input class="input" name="name" placeholder="Nome" required><input class="input" type="email" name="email" placeholder="E-mail"><input class="input" name="phone" placeholder="Telefone/WhatsApp"><input class="input" name="subject" placeholder="Assunto"></div><textarea name="message" placeholder="Mensagem" required></textarea><button class="btn primary">Enviar mensagem</button></form></div></main>{% endblock %}
