{% macro fields(products, current=none) %}
<fieldset class="full"><legend>Combos e Leve junto</legend>
<label class="check"><input type="checkbox" name="is_combo256" value="1" {% if current and current.is_combo256 %}checked{% endif %}> 🍻 Mostrar na categoria Combos</label>
<label class="check"><input type="checkbox" name="recommend256" value="1" {% if current and current.recommend256 %}checked{% endif %}> 🔥 Sugerir a promoção deste produto no carrinho</label>
<label>Produtos que combinam com este item<select name="related256" multiple size="5">{% for other in products if not current or other.id != current.id %}<option value="{{other.id}}" {% if current and other.id|string in (current.related256 or '').split(',') %}selected{% endif %}>{{other.name}}</option>{% endfor %}</select></label>
<small>Selecione até 20 itens da sua loja. Ao comprar este produto, o cliente verá até 3 sugestões em “Leve junto”. Promoções só são sugeridas enquanto o preço promocional estiver ativo. O cliente escolhe se deseja adicionar.</small>
</fieldset>
{% endmacro %}
