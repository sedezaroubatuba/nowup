<section data-order-chat="{{chat_order_id}}" class="panel"><h3>Conversa sobre o pedido</h3><div data-chat-messages role="log" aria-live="polite" style="max-height:260px;overflow:auto"></div><form data-chat-form><label>Mensagem<textarea name="message" maxlength="1500" required placeholder="Combine detalhes do pedido, entrega ou retirada"></textarea></label><button class="btn primary">Enviar mensagem</button></form><small data-chat-status role="status"></small></section>
