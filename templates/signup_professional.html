{% extends 'base.html' %}{% block content %}<div class="container"><div class="formCard"><h1>Anuncie seus serviços</h1><p class="muted">Crie seu perfil profissional. Pagamento do serviço continua direto entre você e seu cliente.</p><form method="post"><div class="grid2"><input class="input" name="name" placeholder="Nome profissional / empresa" required><input class="input" type="email" name="email" placeholder="E-mail" required><input class="input" name="phone" placeholder="WhatsApp" required><input class="input" type="password" name="password" placeholder="Senha" minlength="6" required><select name="doc_type"><option>CNPJ</option><option>CPF</option></select><input class="input" name="document" placeholder="CNPJ ou CPF" required><input class="input" name="city" placeholder="Cidade" required><input class="input" name="neighborhood" placeholder="Bairro"><input class="input" name="cep" placeholder="CEP"></div><h3>Categorias (até 5)</h3><div class="checkgrid">{% for c in categories %}<label class="check"><input type="checkbox" name="category_ids" value="{{c.id}}"> {{c.icon}} {{c.name}}</label>{% endfor %}</div><textarea name="description" placeholder="Breve descrição do seu trabalho"></textarea><textarea name="services" placeholder="Serviços prestados"></textarea><button class="btn primary">Criar perfil</button></form></div></div>{% endblock %}
