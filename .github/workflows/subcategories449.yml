name: V449 - categorias acessíveis e cadastro direto
on:
  push:
    branches: [feature/categorias-subcategorias-inline449]
  pull_request:
    branches: [codex/categorias-icones-v230]
permissions:
  contents: read
jobs:
  category-inline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Verificar JavaScript e regras do servidor
        run: |
          node --check static/subcategories261.js
          python -m py_compile nowup_subcategories448.py
          python -m pytest -q tests/test_subcategories448.py tests/test_categories230.py test_admin205.py --disable-warnings
      - name: Preparar navegador
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "NOWUP_CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Simular cadastro de subcategoria no celular
        run: node --test tests/subcategories449.browser.cjs
      - name: Conferir navegação dos tutoriais
        run: node --test tests/tutorials395.test.cjs
      - name: Referência visual das telas (auditoria)
        run: |
          node -e "const fs=require('fs'),c=require('crypto'); console.log('V449_PANEL_SHA='+c.createHash('sha256').update(fs.readFileSync('templates/pro_panel.html')).digest('hex'))"
