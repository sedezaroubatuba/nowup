name: V451 Produtos agrupadores e fotos individuais
on:
  push:
    branches: [feature/v451-produtos-agrupadores-capa]
  pull_request:
    branches: [codex/categorias-icones-v230]
permissions:
  contents: read
jobs:
  groups451:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Validar sintaxe
        run: |
          python -m py_compile app.py nowup_groups260.py nowup_storeapp257.py
          node --check static/menu88.js
          node --check static/storefront187.js
          node --check static/groups260.js
      - name: Testar capas, variantes, preços, carrinho e isolamento
        env:
          NOWUP_DB_ENGINE: sqlite
          NOWUP_ADMIN_EMAIL: v451@example.invalid
          NOWUP_ADMIN_PASSWORD: test-grouped-v451-password
        run: |
          python -m pytest -q tests/test_groups451.py tests/test_subcategories448.py tests/test_categories230.py tests/test_checkout247.py test_admin205.py --disable-warnings
      - name: Conferir tutoriais e navegação
        run: |
          node --test tests/tutorials395.test.cjs
          node tools/check_tutorials395.cjs --reviewed
          echo 'BASELINE_V451_START'
          cat tests/tutorials395-reviewed.json
          echo 'BASELINE_V451_END'
