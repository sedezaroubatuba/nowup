name: PostgreSQL migration checks
on:
  push:
    branches: [codex/postgresql-v239]
  pull_request:
    paths:
      - '**.py'
      - '**.js'
      - '**.cjs'
      - '**.html'
      - '**.css'
      - Dockerfile
      - requirements.txt
      - .github/workflows/postgres239.yml
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    container: postgres:18-bookworm
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: nowup_test
        options: >-
          --health-cmd "pg_isready -U postgres -d nowup_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3 python3-venv
      - run: python3 -m venv /tmp/nowup-test
      - run: /tmp/nowup-test/bin/pip install -r requirements.txt pytest httpx
      - name: SQLite regression checks
        run: /tmp/nowup-test/bin/python -m pytest tests test_admin205.py -q
      - name: PostgreSQL 18 migration, checkout, backup and restore
        env:
          NOWUP_TEST_POSTGRES_URL: postgresql://postgres:ephemeral-test-only@postgres:5432/nowup_test
        run: /tmp/nowup-test/bin/python -m pytest tests/test_postgres239.py -q
  browser-cart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cart-lifecycle247.test.cjs frontend-admin/tests/*.test.mjs
      - run: npm install --no-save --package-lock=false playwright
      - name: Use installed Chrome or prepare Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "NOWUP_CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Desktop scroll and mobile slideshow controls
        run: node --test tests/storefront248.browser.cjs tests/cart251.browser.cjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nowup-postgres239 .
      - run: docker run --rm nowup-postgres239 pg_dump --version
