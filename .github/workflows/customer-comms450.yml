name: Cardápio customer communication V450
on:
  pull_request:
    paths:
      - 'nowup_customer_comms450.py'
      - 'nowup_alerts112.py'
      - 'static/nowup-push-sw.js'
      - 'tests/test_customer_comms450.py'
      - '.github/workflows/customer-comms450.yml'
  push:
    branches:
      - 'feature/comunicacao-clientes-cardapio-v450'
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest 'fastapi==0.162.0' 'python-multipart==0.0.33'
      - name: Check Python and Service Worker syntax
        run: |
          python -m py_compile nowup_customer_comms450.py nowup_alerts112.py tests/test_customer_comms450.py
          node --check static/nowup-push-sw.js
      - name: Test merchant isolation, consent and campaigns
        env:
          NOWUP_DB_ENGINE: sqlite
        run: python -m pytest -q tests/test_customer_comms450.py
