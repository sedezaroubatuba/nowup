name: Tutorial and screen consistency
on:
  pull_request:
  push:
    branches: [codex/categorias-icones-v230]
permissions:
  contents: read
jobs:
  tutorials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Check reviewed screens
        run: node tools/check_tutorials395.cjs
      - name: Check guided navigation and read-only behavior
        run: node --test tests/tutorials395.test.cjs
