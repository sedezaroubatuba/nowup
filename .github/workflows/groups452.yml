name: V452 — layout compacto de agrupadores

on:
  push:
    branches:
      - fix/v452-agrupadores-layout-segunda-previa
  pull_request:
    branches:
      - codex/categorias-icones-v230

permissions:
  contents: read

jobs:
  grouped-mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          npm ci
          python -m pip install -r requirements-dev.txt
      - name: Validar JavaScript
        run: node --check static/groups452.js
      - name: Validar catálogo, carrinho e checkout
        env:
          NOWUP_DB_ENGINE: sqlite
          NOWUP_ADMIN_EMAIL: v452@example.invalid
          NOWUP_ADMIN_PASSWORD: test-grouped-v452-password
        run: |
          python -m pytest -q tests/test_groups451.py tests/test_subcategories448.py tests/test_checkout247.py --disable-warnings
      - name: Preparar navegador
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "NOWUP_CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Testar segunda prévia em 360, 390 e 768 px
        run: node --test tests/groups452.browser.cjs tests/groups451.browser.cjs
