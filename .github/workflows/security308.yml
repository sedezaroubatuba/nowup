name: Security and server regression checks
on:
  pull_request:
    paths: ['*.py', 'templates/**', 'requirements.txt', 'requirements-dev.txt', 'test_admin205.py', 'tests/*.py', '.github/workflows/security308.yml']
  push:
    branches: [codex/categorias-icones-v230]
    paths: ['*.py', 'templates/**', 'requirements.txt', 'requirements-dev.txt', 'test_admin205.py', 'tests/*.py', '.github/workflows/security308.yml']
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Dependency advisory check
        run: pip-audit -r requirements.txt
      - name: Isolated server suites
        env:
          PYTHONPATH: '.:tests'
          NOWUP_ADMIN_EMAIL: audit308@example.invalid
          NOWUP_ADMIN_PASSWORD: isolated-security-test-password
        run: |
          python -m pytest tests test_admin205.py -q --disable-warnings
