name: Testar produtos agrupadores NowUp

on:
  push:
    branches:
      - feature/produtos-agrupados-promocoes-260
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  groups260:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar dependências de aplicação e testes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Rodar regressão de agrupadores
        env:
          NOWUP_DB_ENGINE: sqlite
        run: python -m pytest -q tests/test_groups260.py
      - name: Rodar suíte principal
        env:
          NOWUP_DB_ENGINE: sqlite
        run: python -m pytest -q tests/
